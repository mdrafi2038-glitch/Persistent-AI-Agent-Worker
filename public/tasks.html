<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persistent AI · Tasks</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f6f3;color:#292824}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{width:min(900px,100%);margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
a{color:#6d4b3b}h1{font-size:1.35rem;margin:0}p{color:#777}.panel,.task{background:#fff;border:1px solid #e5e1d9;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #33221108}
label{display:block;font-size:.85rem;color:#555;margin:10px 0 6px}input,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #ddd8cf;background:#faf9f6;color:#292824;font:inherit}
textarea{min-height:120px;resize:vertical}button{border:0;border-radius:9px;padding:11px 16px;background:#292722;color:#fff;font-weight:650;cursor:pointer;margin:8px 8px 0 0}
button:disabled{opacity:.5;cursor:default}.task-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:.78rem;padding:4px 9px;border-radius:20px;background:#eeeae3}.result{white-space:pre-wrap;line-height:1.55;color:#49463f;overflow-wrap:anywhere}.muted{color:#888;font-size:.85rem}.error{color:#b34c3b}
@media(max-width:600px){.wrap{padding:14px}.task-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap">
<header><div><h1>✦ AI Worker · Tasks</h1><p>Queue work, follow progress, and review results.</p></div><a href="/">← Back to chat</a></header>
<section class="panel"><form id="taskForm">
<label for="title">Task title</label><input id="title" maxlength="120" required placeholder="e.g. Research and summarize a topic">
<label for="description">Instructions</label><textarea id="description" maxlength="12000" required placeholder="Describe the result you want. The worker can search the web and work with GitHub using its available tools."></textarea>
<button id="submit" type="submit">Add task to queue</button><div id="error" class="error"></div>
</form></section>
<h2>Your tasks</h2><div id="tasks"><p class="muted">Loading…</p></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href="/";throw new Error("Please sign in from the main chat first.");}if(!r.ok)throw new Error(d.error||"Request failed.");return d;}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){try{const d=await api("/api/tasks");$("tasks").innerHTML=d.tasks.length?d.tasks.map(t=>'<article class="task"><div class="task-head"><strong>'+esc(t.title)+'</strong><span class="status">'+esc(t.status)+' · '+Number(t.attempt_count||0)+'/'+Number(t.max_attempts||3)+' attempts</span></div><p class="muted">'+new Date(t.created_at).toLocaleString()+(t.scheduled_at&&t.status==="queued"?' · retry scheduled '+new Date(t.scheduled_at).toLocaleString():"")+'</p><p>'+esc(t.description)+'</p>'+(t.result?'<div class="result">'+esc(t.result)+'</div>':"")+(t.last_error?'<p class="error">Last error: '+esc(t.last_error)+'</p>':"")+(t.status==="queued"?'<button data-cancel="'+esc(t.id)+'">Cancel queued task</button>':"")+(t.status==="failed"?'<button data-retry="'+esc(t.id)+'">Retry task</button>':"")+'</article>').join(""):'<p class="muted">No tasks yet.</p>';}catch(e){$("tasks").innerHTML='<p class="error">'+esc(e.message)+'</p>';}}
$("taskForm").addEventListener("submit",async e=>{e.preventDefault();$("error").textContent="";$("submit").disabled=true;try{await api("/api/tasks",{method:"POST",body:JSON.stringify({title:$("title").value,description:$("description").value})});$("title").value="";$("description").value="";await load();}catch(e){$("error").textContent=e.message;}finally{$("submit").disabled=false;}});
$("tasks").addEventListener("click",async e=>{const cancel=e.target?.dataset?.cancel,retry=e.target?.dataset?.retry;try{if(cancel)await api("/api/tasks/"+encodeURIComponent(cancel)+"/cancel",{method:"POST",body:"{}"});else if(retry)await api("/api/tasks/"+encodeURIComponent(retry)+"/retry",{method:"POST",body:"{}"});else return;await load();}catch(err){alert(err.message);}});
load();setInterval(load,5000);
</script></body></html>
