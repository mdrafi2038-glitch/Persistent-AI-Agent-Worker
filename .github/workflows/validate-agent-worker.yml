name: Validate AI Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/autonomous-agent-clean, feature/agentic-tool-runtime]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
